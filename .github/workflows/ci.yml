name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        features: [jni, jvmti]
    defaults:
      run:
        shell: pwsh
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - name: Release workflow tests
        if: matrix.profile == 'debug' && matrix.features == 'jni'
        run: ./.github/tests/release-workflow.ps1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formatting
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path tests/java21-host/Cargo.toml
      - name: Check, lint, test, document and package
        run: ./.github/scripts/validate.ps1 -BuildProfile '${{ matrix.profile }}' -Features '${{ matrix.features }}'
      - name: Java 21 host with checked JNI
        run: ./.github/scripts/java21-host.ps1 -BuildProfile '${{ matrix.profile }}' -Features '${{ matrix.features }}'

  publish:
    name: Publish to crates.io and tag
    permissions:
      contents: write
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Sol1de/jvm-link'
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check whether the version is already published
        id: version
        run: ./.github/scripts/check-published-version.ps1
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) { throw 'Configure the CARGO_REGISTRY_TOKEN repository secret before publishing.' }
          cargo publish --locked --registry crates-io
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create missing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_REQUIRED: ${{ steps.version.outputs.publish }}
        run: ./.github/scripts/create-release-tag.ps1
