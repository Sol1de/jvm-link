[package]
name = "jvm-link-discovery-host"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jvm-link-contract = { path = "../.." }
jni = { version = "=0.22.4", default-features = false }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
