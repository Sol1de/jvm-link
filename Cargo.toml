[package]
name = "jvm-link"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Borrow an existing in-process Java 21 JVM on Windows x64"
repository = "https://github.com/Sol1de/jvm-link"
documentation = "https://docs.rs/jvm-link"
readme = "README.md"
keywords = ["java", "jni", "jvm", "windows"]
categories = ["api-bindings"]
include = ["/src/**", "/config.toml", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/spec/**"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[dependencies]
jvmti-bindings = { version = "=3.0.2", optional = true, default-features = false }
jni = { version = "=0.22.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }

[features]
default = []
jvmti = ["dep:jvmti-bindings"]
