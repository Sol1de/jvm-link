[package]
name = "jvm-link-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compilable JVM access contract with internal Windows discovery"

[dependencies]
jni = { version = "=0.22.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }
